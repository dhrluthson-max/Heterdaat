name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  # Optioneel: automatisch bouwen op tags voor releases
  # release:
  #   types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies (Ubuntu 24.04 compatible)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses6-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake \
            python3-venv python3-full

      - name: Cache Buildozer & Pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Accept Android SDK Licenses (Non-interactive)
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel cython
          pip install buildozer

      - name: Build with Buildozer
        run: |
          export PATH=$HOME/.buildozer/android/platform/android-sdk/platform-tools:$PATH
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heterdaad-apk
          path: bin/*.apk
          retention-days: 30

      - name: Create GitHub Release (alleen op tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
