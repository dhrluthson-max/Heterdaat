name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 👇 STAP 1: EERST systeem-dependencies & Java installeren (nodig voor de sdkmanager!)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw6-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake \
            python3-venv python3-full ccache clang

      # 👇 STAP 2: Zet de basis Android SDK commandline-tools neer
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest

      # 👇 STAP 3: Configureer PATH en installeer Android Platforms & NDK
      - name: Install Android Platforms & NDK via SDK Manager
        run: |
          # Definieer de juiste paden expliciet voor deze terminal sessie
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          
          # Accepteer licenties en installeer pakketten
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "ndk;26.3.11579264" "platform-tools"

      - name: Cache Buildozer & Pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
            ~/.ccache
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Configure buildozer.spec for System SDK/NDK
        run: |
          SDK_PATH="/usr/local/lib/android/sdk"
          NDK_PATH="/usr/local/lib/android/sdk/ndk/26.3.11579264"
          
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          
          sed -i "s|#\?\s*android\.sdk_path\s*=.*|android.sdk_path = $SDK_PATH|" buildozer.spec
          sed -i "s|#\?\s*android\.ndk_path\s*=.*|android.ndk_path = $NDK_PATH|" buildozer.spec
          sed -i "s|#\?\s*android\.api\s*=.*|android.api = 34|" buildozer.spec
          sed -i "s|#\?\s*android\.minapi\s*=.*|android.minapi = 21|" buildozer.spec
          
          echo "--- buildozer.spec check ---"
          grep -E "android\.(sdk_path|ndk_path|api|minapi)" buildozer.spec

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel cython
          pip install buildozer

      - name: Build with Buildozer
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heterdaad-apk
          path: bin/*.apk
          retention-days: 30

      - name: Create Release (op tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
